# Shared by local hooks and CI (`make lint`).
# Setup once: uv tool install pre-commit && make hooks
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # keep Markdown hard breaks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--enforce-all]                 # also files already committed
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Staged changes, on every local commit.
      - id: gitleaks
      # Every commit in history; run by `make lint` (and so CI, which checks
      # out full history). The staged hook alone sees nothing on a clean
      # checkout, and `gitleaks dir` would also scan ignored plugin clones.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (git history)
        entry: gitleaks git --redact --no-banner --verbose
        pass_filenames: false
        always_run: true
        stages: [manual]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

# tmux.conf for remote GPU boxes (Ghostty -> ssh -> tmux, one layer).
#
# The point of tmux here: claude / codex / training jobs keep running when the
# ssh connection drops. Reattach with `tmux new -A -s <name>`.
#
# Keys follow the Mac Herdr layout where it makes sense (prefix C-b, h/j/k/l,
# | and -, [ and ] between sessions, q to detach).
# Reload: prefix R

# ─── Terminal ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# Ghostty sends TERM=xterm-256color over ssh. Advertise truecolor and extended
# keys (so Shift+Enter etc. reach claude / codex) for it.
# Fixed indexes (not -a) so reloading does not append duplicates.
set -s terminal-features[10] "xterm-256color:RGB:extkeys"
set -s terminal-features[11] "xterm-ghostty:RGB:extkeys"
set -g extended-keys on
set -sg escape-time 10          # vim <Esc> must feel instant
set -g focus-events on          # lets vim notice files that agents changed
set -g history-limit 100000     # agent output is long
set -g mouse on
set -g set-clipboard on         # copies go to the Mac clipboard via OSC 52
set -g allow-passthrough on

# ─── Behaviour ───────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off    # killing a session jumps to another one
set -g display-time 2000
set -g set-titles on
set -g set-titles-string "#h · #S:#W"
setw -g mode-keys vi
set -g status-keys emacs

# Agents ring the terminal bell when they finish or need input. Flag that
# window in the status bar instead of beeping.
set -g monitor-bell on
set -g bell-action none        # flag only; never forward the beep
set -g visual-bell off

# ─── Keys ────────────────────────────────────────────────────────────────────
bind R source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# New panes / windows open in the current directory.
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind Tab  select-pane -t :.+
bind BTab select-pane -t :.-

# Sessions = projects. [ ] cycles them (same as Herdr workspaces), so copy mode
# moves to v.
bind [ switch-client -p
bind ] switch-client -n
bind N command-prompt -p "new session:" "new-session -s '%%' -c '#{pane_current_path}'"
bind P paste-buffer -p          # prefix ] (default paste) cycles sessions
bind q detach-client
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# Copy mode (mouse wheel also enters it).
bind v copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# prefix e: open this pane's whole scrollback in vim (search / yank long agent
# output with real vim motions). Same key as Herdr's edit_scrollback.
bind e run-shell 'f=/tmp/tmux-scrollback-#{pane_id}.txt; \
    tmux capture-pane -J -p -S - -t "#{pane_id}" > "$f" && \
    tmux new-window -n scrollback "vim + $f; rm -f $f"'

# ─── Look: Catppuccin Mocha by hand, no plugin ───────────────────────────────
set -g status-interval 5
set -g status-style "bg=default,fg=#cdd6f4"   # transparent, like the terminal
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=#f38ba8],#[bg=#89b4fa]}#[fg=#11111b,bold] #S #[default] "
# GPU util/mem + local time (tmux/bin/tmux-status).
# Hostname lives in the terminal title instead (set-titles above).
set -g status-right-length 80
set -g status-right "#{?pane_in_mode,#[fg=#f9e2af]COPY  ,}#[fg=#a6adc8]#(~/.config/tmux/remote-dotfiles/bin/tmux-status) "
setw -g window-status-format         "#[fg=#6c7086] #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[fg=#11111b,bg=#a6e3a1,bold] #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-bell-style     "fg=#11111b,bg=#fab387,bold"
setw -g window-status-separator ""

# Panes: thin borders, and a title bar on each pane (only when the window is
# split) so the active one is obvious: highlighted index + command + dir.
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style        "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-format "#{?pane_active,#[fg=#11111b#,bg=#89b4fa#,bold],#[fg=#a6adc8#,bg=#313244]} #P #{pane_current_command} #[default]#{?pane_active,#[fg=#89b4fa],#[fg=#6c7086]} #{b:pane_current_path} "
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'

set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style    "bg=#45475a,fg=#cdd6f4"
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour        "#6c7086"

# ─── Catppuccin plugin (overrides the look above when installed) ─────────────
if-shell "test -f ~/.config/tmux/remote-dotfiles/plugins/catppuccin/catppuccin.tmux" \
    "source-file ~/.config/tmux/remote-dotfiles/theme.conf"

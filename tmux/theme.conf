# Catppuccin theme, sourced at the end of tmux.conf only when the plugin is
# installed. ~/.config/tmux/remote-dotfiles is a link to this directory.
# Without it, the hand-written colours in tmux.conf stay in effect.

set -g @catppuccin_flavor "mocha"
# Transparent status bar: Ghostty on the Mac is translucent (opacity 0.8 +
# blur), and any explicit background colour renders as an opaque strip.
set -g @catppuccin_status_background "none"
# No Nerd Font icons anywhere in the status bar: tmux on the server counts them
# as 1 cell while Ghostty on the Mac draws them wider, so they overlap their
# neighbours. Only the powerline right half-circle (U+E0B4) is used.
set -g @catppuccin_window_flags "none"

run ~/.config/tmux/remote-dotfiles/plugins/catppuccin/catppuccin.tmux

# Everything in the status bar is written by hand with the theme colours, in
# one shape: pills with a flat left edge and a rounded right edge. The plugin
# supplies the palette (@thm_*), message/menu/pane styles.
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#{@thm_crust}#,bg=#{@thm_red}],#[fg=#{@thm_crust}#,bg=#{@thm_green}]}#[bold] #S #[nobold]#{?client_prefix,#[fg=#{@thm_red}],#[fg=#{@thm_green}]}#[bg=default] "

# Windows: current one is a pill, others are plain text; bell = peach + "!".
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#{@thm_overlay_1}] #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] #I #W#{?window_zoomed_flag, Z,} #[nobold,fg=#{@thm_mauve},bg=default]"
setw -gF window-status-bell-style "fg=#{@thm_peach},bold"
setw -g window-status-activity-style "default"
set -ag window-status-format "#{?window_bell_flag,#[fg=#{@thm_peach}]!,}"

set -g status-right-length 80
set -g status-right "#{?pane_in_mode,#[fg=#{@thm_yellow}]COPY  ,}"
# GPUs are allocated per worker, so checking once at load time is enough.
if-shell "timeout -k 1s 2s nvidia-smi -L >/dev/null 2>&1" \
    "set -ag status-right '#[fg=#{@thm_crust},bg=#{@thm_peach}] GPU #(~/.config/tmux/remote-dotfiles/bin/tmux-status gpu) #[fg=#{@thm_peach},bg=default] '"
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_sapphire}] #(~/.config/tmux/remote-dotfiles/bin/tmux-status time) #[fg=#{@thm_sapphire},bg=default]"

# Keep the pane title bar from tmux.conf, recoloured to the theme.
set -g pane-border-format "#{?pane_active,#[fg=#{@thm_crust}#,bg=#{@thm_lavender}#,bold],#[fg=#{@thm_subtext_0}#,bg=#{@thm_surface_0}]} #P #{pane_current_command} #[default]#{?pane_active,#[fg=#{@thm_lavender}],#[fg=#{@thm_overlay_0}]} #{b:pane_current_path} "
